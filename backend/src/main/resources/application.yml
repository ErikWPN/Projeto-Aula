server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mentoria
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/mentoria}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

management:
  endpoints:
    web:
      exposure:
        include: health

# ---------------------------------------------------------------------------
# CONTEÚDO DA MENTORIA
# Edite aqui (ou sobrescreva com variáveis de ambiente, ex.: MENTORIA_WHATSAPP).
# Turmas, vagas e preços ficam no banco e são editados pelo painel /admin.
# Enquanto a chave Pix tiver a palavra "exemplo", o site mostra o modo demonstração.
# ---------------------------------------------------------------------------
mentoria:
  nome: Primeiro Commit
  titulo: Entenda o computador e escreva seu primeiro programa sem decoreba.
  chamada: TI básica e lógica de programação do zero, ao vivo e em turma pequena.
  formato: Online e ao vivo pelo Google Meet
  publico: Calouros de cursos de TI e quem está migrando de área
  # DDI + DDD + número, só dígitos
  whatsapp: ${MENTORIA_WHATSAPP:5511900000000}
  # Opcional: link de pagamento com cartão (Mercado Pago, InfinitePay...). Vazio esconde o botão.
  link-cartao: ${MENTORIA_LINK_CARTAO:}
  # Por quantas horas uma reserva segura a vaga esperando o Pix
  reserva-horas: 24
  fuso: America/Sao_Paulo
  admin:
    usuario: ${ADMIN_USUARIO:admin}
    # Defina ADMIN_SENHA em produção. Sem ela, uma senha provisória aparece no log ao iniciar.
    senha: ${ADMIN_SENHA:}
  pix:
    chave: ${PIX_CHAVE:chave-pix@exemplo.com}
    nome-recebedor: ${PIX_NOME:Anderson Exemplo}
    cidade: ${PIX_CIDADE:Sao Paulo}
  mentor:
    nome: Anderson
    cargo: "[Cargo do Anderson], [anos] anos em TI"
    bio: >-
      Trabalha com tecnologia todos os dias e já ajudou muita gente a dar os primeiros passos.
      Nas aulas, explica o porquê de cada coisa antes de mostrar o código.
    foto: ""
  ementa:
    - titulo: Como o computador funciona
      topicos: Processador, memória, armazenamento, dispositivos de entrada e saída, sistema operacional, arquivos e pastas.
    - titulo: Redes e internet
      topicos: "O que acontece quando você abre um site: IP, DNS, navegador e servidor. Cuidados básicos de segurança."
    - titulo: Lógica de programação
      topicos: Algoritmos, variáveis, tipos de dados, entrada e saída e condições (se / senão), com exercícios em Portugol.
    - titulo: Repetição e seu primeiro programa
      topicos: Laços, funções e um programa completo do zero, primeiro em Portugol e depois em Python.
  faq:
    - pergunta: Preciso saber alguma coisa antes?
      resposta: Não. A mentoria começa do zero. Se você sabe ligar o computador e usar o navegador, já pode participar.
    - pergunta: O que eu preciso ter?
      resposta: Um computador com internet. Pelo celular dá para assistir, mas não para fazer os exercícios.
    - pergunta: Como confirmo minha vaga?
      resposta: >-
        Pague o Pix gerado no fim do agendamento e envie o comprovante pelo WhatsApp. A vaga fica segura
        enquanto o Pix não vence e é confirmada quando o pagamento é conferido. Você acompanha tudo pelo
        link da sua reserva.
    - pergunta: E se eu desistir?
      resposta: >-
        Você pode desistir em até 7 dias depois do pagamento e recebe o valor de volta
        (direito de arrependimento, art. 49 do Código de Defesa do Consumidor).
  niveis:
    - Nunca programei
    - Já tentei sozinho
    - Estou no começo da faculdade
  origens:
    - Faculdade
    - Indicação de amigo
    - Instagram ou TikTok
    - WhatsApp
    - Outro
