server:
  port: ${PORT:8080}
  # Só ative (FORWARD_HEADERS=framework) atrás de um proxy que reescreve X-Forwarded-*
  # (Render, Railway, Nginx...). Exposto direto, qualquer um poderia forjar o próprio IP.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  compression:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mentoria
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/mentoria}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Bancos gratuitos (Neon, Supabase) aceitam poucas conexões.
      maximum-pool-size: ${DB_POOL:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          # index.html e demais arquivos sem hash: o navegador sempre confere se mudou.
          no-cache: true

management:
  endpoints:
    web:
      exposure:
        include: health

# ---------------------------------------------------------------------------
# CONTEÚDO DA MENTORIA
# Edite aqui (ou sobrescreva com variáveis de ambiente, ex.: MENTORIA_WHATSAPP).
# Turmas, vagas e preços ficam no banco e são editados pelo painel /admin.
# Enquanto a chave Pix tiver a palavra "exemplo", o site mostra o modo demonstração.
# ---------------------------------------------------------------------------
mentoria:
  nome: TI para Leigos
  titulo: Entenda a TI, descubra a área que combina com você e entre com um plano.
  chamada: Mentoria ao vivo para quem está começando ou mudando de carreira. Tudo explicado do zero, sem precisar saber programar.
  formato: Online e ao vivo pelo Google Meet
  publico: Quem quer entrar na TI, está mudando de carreira ou não sabe que área escolher
  # DDI + DDD + número, só dígitos
  whatsapp: ${MENTORIA_WHATSAPP:5511900000000}
  # Opcional: link de pagamento com cartão (Mercado Pago, InfinitePay...). Vazio esconde o botão.
  link-cartao: ${MENTORIA_LINK_CARTAO:}
  # Por quantas horas uma reserva segura a vaga esperando o Pix
  reserva-horas: 24
  fuso: America/Sao_Paulo
  admin:
    usuario: ${ADMIN_USUARIO:admin}
    # Defina ADMIN_SENHA em produção. Sem ela, uma senha provisória aparece no log ao iniciar.
    senha: ${ADMIN_SENHA:}
  pix:
    chave: ${PIX_CHAVE:chave-pix@exemplo.com}
    nome-recebedor: ${PIX_NOME:Anderson Exemplo}
    cidade: ${PIX_CIDADE:Sao Paulo}
  mentor:
    nome: Anderson
    cargo: "[Cargo do Anderson], [anos] anos em TI"
    bio: >-
      Trabalha com tecnologia todos os dias e já ajudou muita gente a encontrar o próprio caminho na área.
      Nas aulas, mostra como a TI funciona por dentro, sem jargão e sem pressa.
    foto: ""
  ementa:
    - titulo: O mapa da TI
      topicos: "Como a tecnologia funciona dentro de uma empresa: computadores, redes, internet, nuvem, dados e inteligência artificial, em linguagem simples."
    - titulo: As áreas por dentro
      topicos: "Suporte e infraestrutura, desenvolvimento, dados, segurança da informação, cloud, UX e produto, qualidade de software: a rotina, o perfil de quem se dá bem e por onde se começa em cada uma."
    - titulo: Mão na massa
      topicos: "Experimente antes de escolher: práticas guiadas e curtas de lógica de programação, análise de dados, redes e segurança e criação de telas."
    - titulo: Seu plano de entrada
      topicos: "A área escolhida, uma trilha de estudos com cursos gratuitos e certificações de entrada, o primeiro portfólio, currículo e LinkedIn para a primeira vaga ou a transição."
  faq:
    - pergunta: Preciso saber programar?
      resposta: Não. Programação é só uma das áreas da TI, e muitas carreiras começam sem escrever código. A mentoria parte do zero.
    - pergunta: Trabalho em outra área há anos. Ainda dá tempo?
      resposta: >-
        A mentoria foi pensada para quem está mudando de carreira. O plano de entrada do último encontro
        leva em conta a sua experiência atual, que muitas vezes conta a favor na nova área.
    - pergunta: Preciso de faculdade de TI?
      resposta: >-
        Para começar em várias áreas, não. Falamos de cursos livres, certificações e graduação, e de quando
        cada um faz sentido para o caminho que você escolher.
    - pergunta: A mentoria garante emprego?
      resposta: >-
        Não. Você sai com uma área escolhida, um plano de estudos e um currículo pronto para começar a se
        candidatar. O resultado depende de você seguir o plano.
    - pergunta: O que eu preciso ter?
      resposta: Um computador com internet. Pelo celular dá para assistir, mas as práticas pedem um computador.
    - pergunta: Como confirmo minha vaga?
      resposta: >-
        Pague o Pix gerado no fim do agendamento e envie o comprovante pelo WhatsApp. A vaga fica segura
        enquanto o Pix não vence e é confirmada quando o pagamento é conferido. Você acompanha tudo pelo
        link da sua reserva.
    - pergunta: E se eu desistir?
      resposta: >-
        Você pode desistir em até 7 dias depois do pagamento e recebe o valor de volta
        (direito de arrependimento, art. 49 do Código de Defesa do Consumidor).
  # "Seu momento hoje" no formulário de agendamento
  niveis:
    - Não sei por onde começar
    - Estou mudando de carreira
    - Já tenho uma área em mente
  origens:
    - Faculdade
    - Indicação de amigo
    - Instagram ou TikTok
    - WhatsApp
    - Outro
